name: openplaud
x-product: &product
  image: openplaud-product:local
  build:
    context: .
    dockerfile: Dockerfile.product
  user: "10001:10001"
  read_only: true
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 96
  tmpfs: ["/tmp:size=64m,mode=1777"]
  volumes:
    - ./state/product:/state
  networks: [private]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  api:
    <<: *product
    command: [python, -m, uvicorn, openplaud.api:factory, --factory, --host, 0.0.0.0, --port, "8767", --no-access-log, --proxy-headers, --forwarded-allow-ips, "${OPENPLAUD_PROXY_IPS:-127.0.0.1}", --limit-concurrency, "16"]
    env_file: ./state/product.env
    environment:
      OPENPLAUD_DATA: /state
      OPENPLAUD_DIARIZATION_ENABLED: "1"
      OPENPLAUD_OLLAMA_URL: http://ollama:11434
      OPENPLAUD_LLM_MODEL: qwen2.5:1.5b
      OPENPLAUD_ALLOWED_HOSTS: "${OPENPLAUD_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      OPENPLAUD_HTTPS_HOSTS: "${OPENPLAUD_HTTPS_HOSTS:-}"
    networks: [private, oauth]
    mem_limit: 384m
    cpus: 0.5
    ports:
      - "${OPENPLAUD_BIND_IP:-127.0.0.1}:8767:8767"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *product
    command: [python, -m, openplaud.worker, --root, /state, --model, /models, --inbox, /inbox]
    environment:
      OPENPLAUD_OLLAMA_URL: http://ollama:11434
      OPENPLAUD_LLM_MODEL: qwen2.5:1.5b
      OPENPLAUD_DIARIZATION_MODELS: /diarization
    volumes:
      - ./state/product:/state
      - ./state/models/whisper-small:/models:ro
      - ./state/models/diarization:/diarization:ro
      - ./state/inbox:/inbox:ro
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
  ollama:
    image: ${OPENPLAUD_OLLAMA_IMAGE:-ollama/ollama:latest}
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    init: true
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      HOME: /tmp
    volumes:
      - ./state/ollama:/models
    networks: [private]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  private:
    internal: true
  oauth:
    driver: bridge
